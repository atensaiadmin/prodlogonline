<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Canvas Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Indigo to Emerald Progress Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Framing -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>

  <g filter="url(#glow)">
    <!-- Main Logged Idea Card -->
    <rect x="136" y="106" width="240" height="300" rx="24" fill="#1e293b" stroke="#334155" stroke-width="6"/>

    <!-- Idea Lines inside Card -->
    <rect x="176" y="156" width="100" height="12" rx="6" fill="#475569"/>
    <rect x="176" y="184" width="160" height="10" rx="5" fill="#334155"/>
    <rect x="176" y="206" width="130" height="10" rx="5" fill="#334155"/>

    <!-- Progress Indicator Bar -->
    <rect x="176" y="340" width="160" height="8" rx="4" fill="#334155"/>
    <rect x="176" y="340" width="110" height="8" rx="4" fill="#10b981"/>

    <!-- Spark / Idea Ignition Core (Centered Overlay) -->
    <path d="M 276 140 
             L 230 240 
             L 265 240 
             L 220 340 
             L 290 220 
             L 255 220 Z" 
          fill="url(#sparkGrad)"/>
  </g>

  <!-- Status Dots -->
  <circle cx="176" cy="370" r="6" fill="#10b981"/>
  <circle cx="196" cy="370" r="6" fill="#6366f1"/>
</svg>
